name: Build Apex Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Location and Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Wrapper and Build Debug APK
        id: gradle_build
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "BUILD FAILED WITH EXIT CODE $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "=== COMPILED APK FILES ==="
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk ./ApexLauncher-Xiaomi17TPro.apk

      - name: Publish Failure Log to Git Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          git add build_log.txt
          git commit -m "Capture build failure log" || true
          git push -f origin build-log || true

      - name: Publish Failure Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failure-log
          name: "Build Failure Log"
          body: "Check build_log.txt for build error details."
          files: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ApexLauncher-Xiaomi17TPro
          path: ./ApexLauncher-Xiaomi17TPro.apk

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Apex Telemetry Launcher v1.0.2"
          body: "Xiaomi 17T Pro için Tesla telemetrili ve donanımsal kamera optimizasyonlu orijinal Android Launcher APK."
          files: ./ApexLauncher-Xiaomi17TPro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
